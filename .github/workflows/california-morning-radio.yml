name: California Morning Weather Radio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'california-radio/**'
      - '.github/workflows/california-morning-radio.yml'
  schedule:
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'

permissions:
  contents: write

concurrency:
  group: california-weather-radio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: california-radio/requirements.txt
      - name: Install free voice and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          pip install -r california-radio/requirements.txt
      - name: Generate new California morning broadcasts
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: |
          cd california-radio
          python -m radio.broadcast --site ../public/california-radio
      - name: Publish today's MP3 recordings
        run: |
          git config user.name 'California Morning Radio Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public/california-radio/data.json public/california-radio/audio/
          git add -u public/california-radio/audio/
          if ! git diff --cached --quiet; then
            git commit -m "radio: publish new Pacific morning forecasts [skip ci]"
            git push origin HEAD:main
          else
            echo 'No audio changes to publish.'
          fi