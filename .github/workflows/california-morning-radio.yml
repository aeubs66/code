name: California Morning Weather Radio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'california-radio/**'
      - '.github/workflows/california-morning-radio.yml'
  schedule:
    # GitHub Actions supports local timezones as of March 2026.
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: california-weather-radio-pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: california-radio/requirements.txt
      - name: Install speech and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          pip install -r california-radio/requirements.txt
      - name: Generate fresh weather recordings
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: |
          cd california-radio
          python -m radio.broadcast --site site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: california-radio/site
      - name: Publish online
        id: deployment
        uses: actions/deploy-pages@v4
